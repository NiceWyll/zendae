name: mi_pendiente
description: "Mi Pendiente - Organización personal simple e intuitiva para tu día, semana y mes."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Persistence & SQLite
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # UI & Icons
  flutter_svg: ^2.0.10+1
  speech_to_text: ^7.5.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/sounds/
