name: Build iOS (Zendae IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - refactor/arquitectura
      - '*'

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar iOS Release (Sin firma para empaquetar IPA)
        run: flutter build ios --release --no-codesign

      - name: Empaquetar archivo IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Zendae-iOS.ipa Payload
          rm -rf Payload

      - name: Subir artefacto IPA
        uses: actions/upload-artifact@v4
        with:
          name: zendae-ios-ipa
          path: Zendae-iOS.ipa
          retention-days: 14
